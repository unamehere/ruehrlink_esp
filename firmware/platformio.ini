; Rührlink – Firmware (ESP-IDF über PlatformIO)
;
; Rührlink-Platine: ESP32-C6-WROOM-1-N8, 8 MB Flash, kein PSRAM. USB-C der Platine = USB-Serial/JTAG
; (z. B. COM18), Flashen ohne BOOT-Taste. Pins über Kconfig (components/*/Kconfig.projbuild).

[platformio]
default_envs = ruehrlink

[env:ruehrlink]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
extra_scripts = pre:version_check.py
; eingebettete Dateien (PlatformIO braucht sie zusaetzlich zu EMBED_TXTFILES in CMake)
board_build.embed_txtfiles =
    components/kenwood/certs/machine_cert.pem
    components/kenwood/certs/machine_key.pem
    components/kenwood/certs/setup_server.pem
