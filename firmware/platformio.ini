; Rührlink – Firmware (ESP-IDF über PlatformIO)

[env:bruecke-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
extra_scripts = pre:version_check.py
; eingebettete Dateien (PlatformIO braucht sie zusaetzlich zu EMBED_TXTFILES in CMake)
board_build.embed_txtfiles =
    components/kenwood/certs/machine_cert.pem
    components/kenwood/certs/machine_key.pem
    components/kenwood/certs/setup_server.pem

; Wie oben, aber ohne PSRAM und mit RAM-Ausgabe: Test, ob ein Chip ohne PSRAM
; (ESP32-C6, 512 KB intern) reicht. Der S3 hat ebenfalls 512 KB internen RAM.
; Eigene sdkconfig: sdkconfig.bruecke-ohne-psram (lokal, nicht im Repo).
[env:bruecke-ohne-psram]
extends = env:bruecke-devkit

; Rührlink-Platine (ESP32-C6-WROOM-1-N8, 8 MB Flash, kein PSRAM). Pins und LED-Art kommen über
; Kconfig-Defaults für den C6 (siehe components/*/Kconfig.projbuild), Flash/Konsole aus sdkconfig.defaults.esp32c6.
; USB-C der Platine = USB-Serial/JTAG (z. B. COM18), Flashen ohne BOOT-Taste.
[env:ruehrlink-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions_8mb.csv
extra_scripts = pre:version_check.py
board_build.embed_txtfiles =
    components/kenwood/certs/machine_cert.pem
    components/kenwood/certs/machine_key.pem
    components/kenwood/certs/setup_server.pem
