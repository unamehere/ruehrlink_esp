; Rührlink – Firmware (ESP-IDF über PlatformIO)

[env:bruecke-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
extra_scripts = pre:version_check.py
; eingebettete Dateien (PlatformIO braucht sie zusaetzlich zu EMBED_TXTFILES in CMake)
board_build.embed_txtfiles =
    components/kenwood/certs/machine_cert.pem
    components/kenwood/certs/machine_key.pem
    components/kenwood/certs/setup_server.pem

; Wie oben, aber ohne PSRAM und mit RAM-Ausgabe: Test, ob ein Chip ohne PSRAM
; (ESP32-C6, 512 KB intern) reicht. Der S3 hat ebenfalls 512 KB internen RAM.
; Eigene sdkconfig: sdkconfig.bruecke-ohne-psram (lokal, nicht im Repo).
[env:bruecke-ohne-psram]
extends = env:bruecke-devkit
